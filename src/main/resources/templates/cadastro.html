<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Caixa Eletrônico</title>
 <style>
  body {
  font-family: 'Courier New', monospace;
  margin: 0;
  padding: 20px;
  background-color: #1c1c1c;
  color: #00ff99;
}

h1 {
  text-align: center;
  color: #00ff99;
  font-size: 2em;
  margin-bottom: 30px;
  text-shadow: 0 0 5px #00ff99;
}

.section {
  background-color: #000;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px #00ff99;
  margin-bottom: 30px;
  border: 2px solid #00ff99;
}

/* Campos de entrada */
input[type="number"],
input[type="password"],
input[type="text"] {
  font-family: 'Courier New', monospace;
  background-color: #1c1c1c;
  color: #00ff99;
  border: 1px solid #00ff99;
  padding: 10px;
  margin: 5px auto;
  border-radius: 4px;
  width: 100%;
  max-width: 300px;
  box-sizing: border-box;
  display: block;
}

/* Botões padrão */
button {
  font-family: 'Courier New', monospace;
  background-color: #00ff99;
  color: #000;
  font-weight: bold;
  border: none;
  padding: 10px;
  margin: 10px auto;
  border-radius: 4px;
  width: 100%;
  max-width: 200px;
  display: block;
  cursor: pointer;
}

button:hover {
  background-color: #00cc88;
}

/* Botão de limpar */
.limpar {
  background-color: #ff3333;
  color: white;
}

.limpar:hover {
  background-color: #cc0000;
}

/* Mensagens */
.sucesso {
  color: #00ff99;
  margin-top: 10px;
}

.erro {
  color: #ff3333;
  margin-top: 10px;
}

.resultado {
  margin-top: 10px;
}

.mensagem-sucesso {
  margin-top: 20px;
  padding: 15px;
  background-color: #222;
  border: 1px solid #00ff99;
  border-radius: 8px;
  color: #00ff99;
  text-align: center;
}

 </style>
  </style>
  <script>
  function limparResultados() {
    document.querySelectorAll('.sucesso, .erro').forEach(el => el.style.display = 'none');
  }
</script>
</head>
<body>
  <h1>💳 Caixa Eletrônico</h1>
<div class="section">
  <form th:action="@{/criar}" method="post">
    <h2>💰 Cadastrar Conta</h2>
    <input type="text" name="titular" placeholder="Titular da Conta" required>
    <input type="number" name="valor" placeholder="Valor Inicial" step="0.01" min="0.0" required>
    <input type="password" name="senha" placeholder="Senha numérica (4 a 6 dígitos) 🔒" pattern="\d{4,6}" required>
    <button type="submit">Cadastrar</button>
    <button type="button" class="limpar" onclick="limparResultados()">Limpar</button>
  </form>
<div th:if="${contaCriada != null}" class="mensagem-sucesso">
  <h3>✅ Conta cadastrada com sucesso!</h3>
  <p><strong>ID:</strong> <span th:text="${contaCriada.id}"></span></p>
  <p><strong>Titular:</strong> <span th:text="${contaCriada.titular}"></span></p>
  <p><strong>Saldo inicial:</strong> R$ <span th:text="${contaCriada.saldo}"></span></p>
  <script>
    setTimeout(function() {
      window.location.href = '/'; // ou '/index' dependendo da sua rota
    }, 5000); // 5000 milissegundos = 5 segundos
  </script>
</div>
  <!-- ⚠️ Erro na criação -->
  <div th:if="${erroCriacao != null}" class="erro">
    <p th:text="${erroCriacao}"></p>
  </div>
    </div>
  </div>

  
  </div>
</body>
</html>
